[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-action-rnd"
version = "0.1.0"
description = "Human Action and Procedure Understanding research baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "PyYAML>=6,<7",
  "torch>=2.4,<3",
  "huggingface_hub>=0.26,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
